on: { push: { branches: [ main ] } }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  deploy:
    environment: { name: github-pages, url: "${{steps.deployment.outputs.page_url}}" }
    runs-on: ubuntu-latest
    steps:
      - { name: Checkout, uses: actions/checkout@v6 }
      - { name: Setup pnpm, uses: pnpm/action-setup@v4, with: { version: 10, run_install: true, cache: true } }
      - { name: Setup Node.js environment, uses: actions/setup-node@v6, with: { node-version: ^20.10 || ^22 || >=24, cache: pnpm } }
      - run: pnpm build
      - { name: Setup Pages, uses: actions/configure-pages@v5 }
      - { name: Upload artifact, uses: actions/upload-pages-artifact@v4, with: { path: dist } }
      - { name: Deploy to GitHub Pages, id: deployment, uses: actions/deploy-pages@v4 }
